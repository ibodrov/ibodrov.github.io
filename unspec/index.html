<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Unspec</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            background-color: #000;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            flex-direction: column;
        }
        canvas {
            display: block;
            max-width: 100%;
            max-height: 100%;
        }
        #start-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }
        #start-button {
            padding: 20px 40px;
            font-size: 24px;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-family: Arial, sans-serif;
        }
        #start-button:hover {
            background-color: #45a049;
        }
        .hidden {
            display: none !important;
        }
    </style>
</head>
<body>
    <div id="start-overlay">
        <button id="start-button">Click to Start</button>
    </div>
    <script type="module">
        import init from './target/wasm/unspec.js';

        async function run() {
            // Wait for user interaction before starting
            const startButton = document.getElementById('start-button');
            const startOverlay = document.getElementById('start-overlay');

            startButton.addEventListener('click', async () => {
                // Hide the overlay
                startOverlay.classList.add('hidden');

                // Resume audio context (required for web audio to work)
                const AudioContext = window.AudioContext || window.webkitAudioContext;
                if (AudioContext) {
                    const ctx = new AudioContext();
                    await ctx.resume();
                }

                // Initialize the WASM app
                await init();
            });
        }

        run().catch(console.error);
    </script>
</body>
</html>
